spring:
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
  datasource:
    dynamic:
      primary: master
      datasource:
        master:
          url: jdbc:opengauss://127.0.0.1:7001/postgres?currentSchema=public
          driverClassName: org.opengauss.Driver
          username: scott
          password: '******'
    type: com.alibaba.druid.pool.DruidDataSource
#    driver-class-name: org.opengauss.Driver
#    url: jdbc:opengauss://127.0.0.1:5432/postgres?currentSchema=public
#    username: scott
#    password: ******
    druid:
      test-while-idle: false
      test-on-borrow: true
      validation-query: "select 1"
      validation-query-timeout: 10000
      connection-error-retry-attempts: 0
      break-after-acquire-failure: true
      max-wait: 300000

mybatis-plus:
  typeAliasesPackage: com.nctigba.observability.instance.entity,org.opengauss.admin.common.core.domain.entity