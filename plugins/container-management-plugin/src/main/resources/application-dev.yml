server:
  port: 8080
mybatis-plus:
  typeAliasesPackage: org.opengauss.admin.container.domain
  mapperLocations: classpath*:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# 自定义配置文件
myProps:
  # CMDB系统接口
  customCmdbSystemUrl: http://127.0.0.1:8080/cmdb/api-service/api/getAppInformation
  initdb:
    enable: true
  platform4a:
    host: http://127.0.0.1:8080
    url: /zyzx/syncDataApi/api/dbSync
    businessSystemCode: 1
    resourceDomainId: 2
  lock:
    expireInterval: 3
    generalDataAudit: GeneralDataAuditLockKey
    opengaussClusterRegister: OpengaussClusterRegisterLockKey
    opengaussOperatorRefresh: OpengaussOperatorRefreshLockKey
  monitor:
    url: http://127.0.0.1:8080/api
    host: no
  openGaussOperator:
    quantity:
      max: 100

spring:
  web:
    resources:
      static-locations: classpath:resources